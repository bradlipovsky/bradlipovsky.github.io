<header class="site-header" data-site-header>
  <div class="shell site-header__inner">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Brad Lipovsky, home">
      <span class="site-brand__mark" aria-hidden="true"><span></span><span></span><span></span></span>
      <span class="site-brand__text"><strong>Brad Lipovsky</strong><small>Geophysics · UW</small></span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" data-nav-toggle>
      <span class="nav-toggle__label">Menu</span>
      <span class="nav-toggle__icon" aria-hidden="true"><span></span><span></span></span>
    </button>
    <nav class="site-nav" id="site-navigation" aria-label="Primary navigation" data-site-nav>
      <ul>
        {% for item in site.data.navigation.main %}
          {% assign item_path = item.url | append: '/' %}
          <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url or page.url == item_path %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
